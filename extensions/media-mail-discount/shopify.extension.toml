# [DEMO 1] media-mail-discount — shipping discount Function (spec addendum §4b).
#
# [SLIDE D2] A Function pins its OWN api_version, independent of the app's
# webhooks (shopify.app.toml) and of the checkout extension (which sits at
# 2026-04). Pinned to 2026-07 to match the app's webhook/Admin API surface —
# this is the quarterly-bump talking point: nothing moves until you move it,
# and each surface moves separately.
#
# Changing api_version means re-running `shopify app function schema` +
# `npm run typegen` — schema.graphql and generated/ are version-locked to it.
api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "media-mail-discount"
type = "function"
uid = "5808f6a6-a119-ffe7-1795-f81f2a4ab447cfa590ea"
description = "t:description"

  # purchase.shipping-discount.run — Shopify calls `run` (exported from src/run.js)
  # while pricing the cart, with the result of input_query as its only argument.
  [[extensions.targeting]]
  target = "purchase.shipping-discount.run"
  input_query = "src/run.graphql"
  export = "run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  [extensions.ui.paths]
  create = "/"
  details = "/"
