# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

# [ADDENDUM A1] App name renders as "Platform App" everywhere; the "(Demo)" suffix
# lives only on the Dev Dashboard record, not here.
client_id = "08ec5164837e2e772360d9bb0c0572a0"
name = "Platform App"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

# [SLIDE D1] all webhook topics -> /webhooks (HOOK-01..06). Single URI: React
# Router cannot route two files to one URI, so every topic + compliance topic
# is declared under this one subscription and fanned out by topic in the
# consolidated app/routes/webhooks.tsx route + app/jobs/processWebhooks.ts worker.
[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled", "shop/update", "app/scopes_update" ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

# [SLIDE D1] access scopes (spec §3) — read-mostly: read_products + read_themes required.
# read_locales is the single optional scope, requested at runtime on the Permissions
# route (Demo 6) via the App Bridge scopes API; app/scopes_update fires on the grant and
# the worker reconciles Store.grantedScopes. (read_content stays in a branch as the Demo 6
# re-approval scope.) Phase 5's write_* / metaobject scopes were removed with the showcase.
[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_themes"
optional_scopes = [ "read_locales" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
