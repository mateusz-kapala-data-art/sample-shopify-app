# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

# [ADDENDUM A1] App name renders as "Platform App" everywhere; the "(Demo)" suffix
# lives only on the Dev Dashboard record, not here.
client_id = "08ec5164837e2e772360d9bb0c0572a0"
name = "Platform App"
application_url = "https://sample-shopify-app-fawn.vercel.app"
embedded = true

[build]
# false: the app is hosted on Vercel, so a local `shopify app dev` must NOT overwrite
# application_url/redirect_urls (above) with an ephemeral tunnel URL.
automatically_update_urls_on_dev = false

# [SLIDE D1] all webhook topics -> /webhooks (HOOK-01..06). Single URI: React
# Router cannot route two files to one URI, so every topic + compliance topic
# is declared under this one subscription and fanned out by topic in the
# consolidated app/routes/webhooks.tsx route + app/jobs/processWebhooks.ts worker.
[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  # Record a broad set of store events so the Webhook log shows real activity. Limited to
  # what read_products + read_themes (+ app-level topics) allow — orders/customers/inventory
  # webhooks would each need their own scope (and orders/customers are protected data).
  topics = [
    "app/uninstalled", "app/scopes_update", "shop/update",
    "themes/create", "themes/update", "themes/publish", "themes/delete",
    "products/create", "products/update", "products/delete",
    "collections/create", "collections/update", "collections/delete"
  ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

# [SLIDE D1] access scopes (spec §3) — read-mostly: read_products + read_themes required.
# write_pixels + read_customer_events + read_pixels (Demo 1b) are required so the
# release-pixel web pixel can be activated (webPixelCreate), subscribe to customer events,
# and be read back (webPixel query) to show its activation state on the Live extensions
# page. Adding these required scopes re-prompts already-installed stores on next load —
# that's the per-store re-approval story (slide I2). (flowTriggerReceive needs no scope.)
# read_locales (Demo 6) and write_shipping (Demo 5) are optional scopes, requested at
# runtime via the App Bridge scopes API on their respective routes; app/scopes_update
# fires on the grant and the worker reconciles Store.grantedScopes. (read_content stays
# in a branch as the Demo 6 re-approval scope.) write_shipping backs the "Enable shipping
# module" button on the registry per-store page — adding checkout shipping methods via
# deliveryProfileUpdate.
[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_themes,write_pixels,read_customer_events,read_pixels"
optional_scopes = [ "read_locales", "write_shipping" ]

[auth]
redirect_urls = [ "https://sample-shopify-app-fawn.vercel.app/api/auth" ]
